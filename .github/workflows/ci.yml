name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv lock --check
      - run: uv run --locked ruff check src tests
      - run: uv run --locked ruff format --check src tests
      - run: uv run --locked python scripts/check_versions.py
      - run: uv run --locked pytest -q
      # The wheel as users get it: the commands start
      - run: uv build
      - name: Check the built wheel
        shell: bash
        run: |
          uv run --isolated --no-project --with dist/*.whl zumen-gate-mcp --version
          uv run --isolated --no-project --with dist/*.whl zumen-gate --help
